name: Update Dependencies

on:
  schedule:
    - cron: "0 0 * * *" # 毎日 UTC 0:00（JST 9:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # action を SHA 固定する理由: このジョブは contents: write で main へ直接
      # push するため、上流が乗っ取られると任意のコミットを混入させられる。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # --- flake inputs ---
      - name: Update flake inputs
        run: nix flake update

      # --- claude-code ---
      - name: Update claude-code
        run: bash scripts/update-claude-code.sh

      # --- commit & push ---
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock overlays/claude-code-manifest.json
          git diff --cached --quiet && echo "Already up to date" && exit 0
          git commit -m "依存パッケージを更新"
          git push

  # GITHUB_TOKEN による push は on:push を発火させないため、
  # 依存更新後のビルドは build.yml を直接呼び出して繋ぐ。
  build:
    needs: update
    uses: ./.github/workflows/build.yml
    with:
      ref: main
    secrets: inherit
